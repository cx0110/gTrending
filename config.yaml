settings:
  enable_llm: false
  # 列表限制：每个分类只抓取前 N 个 (GitHub Trending 一页通常 25 个)
  top_list_limit: 10
  # AI 模型: 推荐 Groq 的 llama-3.3-70b-versatile 或 gpt-4o-mini
  ai_model: "llama-3.3-70b-versatile"

  # 过滤规则
  filters:
    min_daily_stars: 10     # 每日新增星阈值，低于此值过滤
    min_total_stars: 500    # 总星数阈值，低于此值过滤
    skip_no_description: true  # 跳过无描述项目

  history_file: "data/history.json"
  archive_dir: "archives"
  readme_file: "README.md"
  readme_header: |
    # 📈 GitHub Trending 每日追踪
    
    自动抓取 GitHub 官方热榜，由 AI 辅助生成中文摘要。
    
    > 更新时间: {{ update_time }}

# 定义你要抓取的页面
collections:
  - title: "🔥 全球热榜 (General)"
    url: "https://github.com/trending"

  - title: "🐹 Go 语言热门"
    url: "https://github.com/trending/go?since=daily"
        
  - title: "🐍 Python 热门"
    url: "https://github.com/trending/python?since=daily"

  - title: "🟨 JavaScript/TypeScript 热门"
    url: "https://github.com/trending/javascript?since=daily"

  - title: "☕ Java 热门"
    url: "https://github.com/trending/java?since=daily"

  - title: "🦀 Rust 热门"
    url: "https://github.com/trending/rust?since=daily"

  - title: "cpp C/C++ 热门"
    url: "https://github.com/trending/cpp?since=daily"

  - title: "🔷 C# 热门"
    url: "https://github.com/trending/csharp?since=daily"

  - title: "🎯 TypeScript 热门"
    url: "https://github.com/trending/typescript?since=daily"

  - title: "💜 Vue 热门"
    url: "https://github.com/trending/vue?since=daily"

  - title: "⚛️ React 热门"
    url: "https://github.com/trending/react?since=daily"

  - title: "🤖 AI/ML 热门"
    url: "https://github.com/trending?since=daily&spoken_language_code=zh"
