name: Daily Trending Scraper

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # 必须开启写入权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          # 在 GitHub Secrets 中配置这些变量
          # 设为 'true' 启用 LangChain，设为 'false' 仅抓取
          TZ: 'Asia/Shanghai'
          ENABLE_LLM: ${{ vars.ENABLE_LLM || 'false' }} 
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 如果使用第三方/代理，请配置 BASE_URL，否则默认官方
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: python main.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 暂存所有更改 (包括 archives/ 和 data/history.json 和 README.md)
          git add .
          
          # 检查是否有变动
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "bot: update trending for $(date +'%Y-%m-%d')"
            git push
          fi
      # === 新增步骤：推送到 Obsidian 仓库 (Repo B) ===
      - name: Push to Obsidian Vault
        uses: cpina/github-action-push-to-another-repository@main
        env:
          TZ: 'Asia/Shanghai'
          # 记得在 Repo A 的 Secrets 里配置 API_TOKEN_GITHUB
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          # 来源：你的 Python 脚本生成的文件夹名 (config中 settings['archive_dir'] 的值)
          # 默认为 archives/，如果你没改 config.yaml 就是这个
          source-directory: 'archives/'
          
          # 目标：你的 GitHub 用户名
          destination-github-username: 'cx0110'
          
          # 目标：你的 Obsidian 仓库名
          destination-repository-name: 'ob-vault'
          
          # 你的邮箱
          user-email: 'github.cx0110@gmail.com'
          
          # 目标分支 (通常是 main 或 master)
          target-branch: main
          
          # 【关键】目标路径：符合你的 PARA 结构
          # 警告：这个文件夹内的旧内容会被 source-directory 的内容完全覆盖/同步
          # 所以必须指定一个专属的子文件夹，不要直接填 00_Inbox，否则 Inbox 其他文件会被删！
          target-directory: '90_Archives/Tech_News/Github'
          # === 修改部分：推送到博客 (创建模式) ===
      - name: Create Post in Hugo Blog
        env:
          TZ: 'Asia/Shanghai'
          BLOG_REPO_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
          BLOG_REPO: ${{ vars.BLOG_REPO }}
        run: |
          TODAY=$(date +'%Y-%m-%d')
          # 设定统一的文件夹名称，Repo B 也要用这个
          POST_DIR="content/post/${TODAY}-daily-news"
          
          # 1. Clone 博客仓库
          git clone --depth 1 https://x-access-token:${BLOG_REPO_TOKEN}@github.com/${BLOG_REPO}.git blog
          
          # 2. 创建目录
          mkdir -p "blog/${POST_DIR}"
          TARGET_FILE="blog/${POST_DIR}/index.md"
          
          # 3. 写入 Front Matter (覆盖模式，因为它是第一个运行的)
          cat > "$TARGET_FILE" << EOF
          ---
          title: "🔥 每日技术热点 ${TODAY}"
          subtitle: "GitHub Trending & 技术动态"
          summary: "今日热门开源项目与技术资讯汇总"
          authors:
            - admin
          tags:
            - GitHub
            - Trending
            - 技术热点
          categories:
            - 每日热点
          date: ${TODAY}T09:00:00+08:00
          lastmod: ${TODAY}T09:00:00+08:00
          featured: false
          draft: false
          image:
            filename: github-logo.svg
            focal_point: Smart
            preview_only: false
          ---
          
          ## 📈 GitHub Trending
          
          EOF
          
          # 4. 追加 Repo A 的内容 (去掉第一行标题，防止重复)
          if [ -f "archives/${TODAY}.md" ]; then
            sed '1{/^#/d;}' "archives/${TODAY}.md" >> "$TARGET_FILE"
          else
            sed '1{/^#/d;}' README.md >> "$TARGET_FILE"
          fi
          
          # 5. 推送
          cd blog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "📰 Create Daily: ${TODAY}"
            git push
          fi
